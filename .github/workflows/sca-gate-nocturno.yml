# Copiar en .github/workflows/ del repositorio que se quiere proteger.
# Sustituir 0462a81b1ca7a3b120c0cd3d46354e02d7f8655e por el commit de Lewlies/sca-gate que se haya revisado.
#
# Escanea cada noche la rama principal con Dependency-Check ademas del par de
# PR. Es la unica que ve bibliotecas JavaScript embebidas (causa C2 del TFG) y
# detecto en solitario 4 de los 19 clusteres KEV del corpus real, pero tarda y
# necesita la base de datos del NVD, por eso no va en cada PR.
#
# Si la decision es BLOQUEA o ERROR abre (o actualiza) una incidencia con la
# etiqueta sca-gate; cuando deja de bloquear, la cierra. Cubre lo que ninguna
# PR puede ver, una vulnerabilidad publicada o anadida a KEV despues de fusionar.
#
# Excepcion deliberada a "ningun secreto en los escaneres": Dependency-Check
# recibe NVD_API_KEY. Solo da acceso a datos publicos del NVD con mas cuota, y
# este flujo solo corre sobre la rama principal, nunca sobre codigo de una PR.
name: sca-gate-nocturno

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  escanear:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache de la base de datos de Dependency-Check
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sca-gate-dc
          key: sca-gate-dc-${{ github.run_id }}
          restore-keys: sca-gate-dc-

      - name: sca-gate
        uses: Lewlies/sca-gate@0462a81b1ca7a3b120c0cd3d46354e02d7f8655e # v1.0.0
        with:
          herramientas: trivy,osv-scanner,dependency-check
          nvd-api-key: ${{ secrets.NVD_API_KEY }}
          dc-datos: ~/.cache/sca-gate-dc
          excepciones: .sca-excepciones.toml
          dias-artefacto: "90"

  incidencia:
    needs: escanear
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Informe del escaneo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: sca-gate-informe
          path: sca-gate-informe

      - name: Abrir, actualizar o cerrar la incidencia
        uses: Lewlies/sca-gate/publicar@0462a81b1ca7a3b120c0cd3d46354e02d7f8655e # v1.0.0
        with:
          destino: incidencia
